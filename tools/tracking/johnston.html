<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>존스턴 캐년 | 트래킹</title>

    <!-- 트래킹 공통 CSS -->
    <link rel="stylesheet" href="tracking.css">

</head>

<body>

    <div class="container">


        <!-- ============================================
             뒤로가기
        ============================================= -->

        <button class="back-button"
                onclick="history.back()">

            ← 트래킹

        </button>


        <!-- ============================================
             장소명
        ============================================= -->

        <h1 class="page-title">

            🥾 존스턴 캐년

        </h1>

        <p class="page-subtitle">

            Johnston Canyon

        </p>


        <!-- ============================================
             한 줄 소개
        ============================================= -->

        <div class="card">

            <div class="recommend">

                ⭐ 협곡을 따라 걷는 로키 최고의 인기 트래킹

            </div>

        </div>


        <!-- ============================================
             대표 사진
        ============================================= -->

        <img src="images/johnston.jpg"
             alt="존스턴 캐년"
             class="track-image">


        <!-- ============================================
             우리 일정
        ============================================= -->

        <div class="notice-box">

            <div class="section-title">

                📅 우리 일정

            </div>

            <p>

                Day 2 저녁

            </p>

        </div>


        <!-- ============================================
             코스 선택
        ============================================= -->

        <div class="section-title">

            🥾 코스 선택

        </div>


        <!-- ============================================
             Lower Falls
        ============================================= -->

        <a href="johnston-lower.html">

            <div class="course-card">

                <div class="course-title">

                    Lower Falls

                </div>

                <div class="course-summary">

                    ⭐ 가장 인기 있는 폭포 전망대

                </div>

                <div class="course-info">

                    <span>🚶 2.4km</span>

                    <span>⏱ 45~60분</span>

                    <span>💪 쉬움</span>

                </div>

            </div>

        </a>


        <!-- ============================================
             Upper Falls
        ============================================= -->

        <a href="johnston-upper.html">

            <div class="course-card">

                <div class="course-title">

                    Upper Falls

                </div>

                <div class="course-summary">

                    ⭐ 더 웅장한 폭포를 만나는 대표 코스

                </div>

                <div class="course-info">

                    <span>🚶 5.4km</span>

                    <span>⏱ 2시간</span>

                    <span>💪 쉬움</span>

                </div>

            </div>

        </a>

                <!-- ============================================
             Ink Pots
        ============================================= -->

        <a href="johnston-inkpots.html">

            <div class="course-card">

                <div class="course-title">

                    Ink Pots

                </div>

                <div class="course-summary">

                    ⭐ 맑은 샘과 초원을 만나는 장거리 코스

                </div>

                <div class="course-info">

                    <span>🚶 11.7km</span>

                    <span>⏱ 4~5시간</span>

                    <span>💪 보통</span>

                </div>

            </div>

        </a>


        <hr class="divider">


        <!-- ============================================
             Google Maps
        ============================================= -->

        <a href="https://maps.google.com/?q=Johnston+Canyon"
           target="_blank"
           class="map-button">

            📍 Google Maps

        </a>


        <!-- ============================================
             뒤로가기
        ============================================= -->

        <button class="back-button"
                onclick="history.back()">

            ← 트래킹

        </button>

    </div>

</body>

</html>
