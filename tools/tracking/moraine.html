<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>모레인 호수 | 트래킹</title>

    <!-- 트래킹 공통 CSS -->
    <link rel="stylesheet" href="tracking.css">

</head>

<body>

    <div class="container">


        <!-- ============================================
             뒤로가기
        ============================================= -->

        <button class="back-button"
                onclick="history.back()">

            ← 트래킹

        </button>


        <!-- ============================================
             장소명
        ============================================= -->

        <h1 class="page-title">

            🏞 모레인 호수

        </h1>

        <p class="page-subtitle">

            Moraine Lake

        </p>


        <!-- ============================================
             한 줄 소개
        ============================================= -->

        <div class="card">

            <div class="recommend">

                ⭐ 로키를 대표하는 에메랄드빛 호수와 최고의 전망

            </div>

        </div>


        <!-- ============================================
             대표 사진
        ============================================= -->

        <img src="images/moraine.jpg"
             alt="Moraine Lake"
             class="track-image">


        <!-- ============================================
             우리 일정
        ============================================= -->

        <div class="notice-box">

            <div class="section-title">

                📅 우리 일정

            </div>

            <p>

                Day 3 오전

            </p>

        </div>


        <!-- ============================================
             코스 선택
        ============================================= -->

        <div class="section-title">

            🥾 코스 선택

        </div>

     

        <!-- ============================================
             Rockpile Trail
        ============================================= -->

        <a href="moraine-rockpile.html">

            <div class="course-card">

                <div class="course-title">

                    Rockpile Trail

                </div>

                <div class="course-summary">

                    ⭐ 모레인 호수 최고의 전망 포인트

                </div>

                <div class="course-info">

                    <span>🚶 0.8km</span>

                    <span>⏱ 20~30분</span>

                    <span>💪 매우 쉬움</span>

                </div>

            </div>

        </a>

         <!-- ============================================
             Lakeshore Trail
        ============================================= -->

        <a href="moraine-lakeshore.html">

            <div class="course-card">

                <div class="course-title">

                    Lakeshore Trail

                </div>

                <div class="course-summary">

                    ⭐ 모레인 호수를 가장 가까이에서 걷는 산책 코스

                </div>

                <div class="course-info">

                    <span>🚶 왕복 3km</span>

                    <span>⏱ 45~60분</span>

                    <span>💪 매우 쉬움</span>

                </div>

            </div>

        </a>


                <!-- ============================================
             Consolation Lakes
        ============================================= -->

        <a href="moraine-consolation.html">

            <div class="course-card">

                <div class="course-title">

                    Consolation Lakes

                </div>

                <div class="course-summary">

                    ⭐ 빙하와 한적한 호수를 만나는 힐링 트레킹

                </div>

                <div class="course-info">

                    <span>🚶 왕복 5.8km</span>

                    <span>⏱ 2~2.5시간</span>

                    <span>💪 보통</span>

                </div>

            </div>

        </a>


        <hr class="divider">


        <!-- ============================================
             Google Maps
        ============================================= -->

        <a href="https://maps.google.com/?q=Moraine+Lake"
           target="_blank"
           class="map-button">

            📍 Google Maps

        </a>


        <!-- ============================================
             뒤로가기
        ============================================= -->

        <button class="back-button"
                onclick="history.back()">

            ← 트래킹

        </button>

    </div>

</body>

</html>
