<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Day 1</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#eef5ff;
}

header{
    background:#1565c0;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
}

.container{
    width:900px;
    margin:auto;
    padding:40px;
}

.card{

    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    margin-bottom:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.photo{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:20px;
}

.info{
    margin:18px 0;
}

.info strong{
    display:block;
    font-size:20px;
    margin-bottom:8px;
}

.info span{
    display:block;
    margin-left:30px;
    color:#555;
    line-height:1.7;
}
    
.caption{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-top:-10px;
    margin-bottom:25px;
}

.info{
    background:#f5f9ff;
    border-left:5px solid #1976d2;
    padding:12px 16px;
    border-radius:10px;
    margin:12px 0;
}
    
h2{
    color:#1565c0;
}

.time{

    font-size:20px;
    font-weight:bold;
    color:#1976d2;

}

button{

    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:18px;
    cursor:pointer;

}

</style>

</head>

<body>

<header>
    🌄 Day 1 - 캘거리 → 캔모어
</header>

<div class="container">

    <div class="card">

<img src="https://images.unsplash.com/photo-1569154941061-e231b4725ef1?auto=format&fit=crop&w=1200&q=80" class="photo">

      
        
    <h2>🕖 07:00</h2>

    <h3>✈️ 인천공항 출발</h3>

    <div class="info">
    <strong>✈️ 항공편</strong>
    <span>웨스트젯(WestJet) 직항</span>
    <span>인천(ICN) → 캘거리(YYC)</span>
</div>

    <div class="info">
    <strong>📍 위치</strong>
    <span>인천국제공항 제1터미널</span>
</div>

    <hr>

    <div class="info">
    <strong>🕒 비행시간</strong>
    <span>약 10시간 30분</span>
</div>

   <div class="info">
    <strong>🎯 다음 목적지</strong>
    <span>캘거리 국제공항(YYC)</span>
</div>

</div>

    <div class="card">
        <h2>캘거리 도착</h2>
        <p>렌터카 수령 후 캔모어 이동</p>
    </div>

    <div class="card">
        <h2>체크인</h2>
        <p>숙소에서 휴식</p>
    </div>

    <div class="card">
        <h2>저녁 식사</h2>
        <p>캔모어 시내 산책</p>
    </div>

    <br>

 <button onclick="location.href='home.html'">
    ← 메인으로
</button>

</div>
</body>
</html>
